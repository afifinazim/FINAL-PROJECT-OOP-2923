<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <h1 class="app-title">📚 Reading Tracker</h1>
        <p class="subtitle">Search your favorite author and explore their books</p>

        <div class="search-box">
            <input type="text" id="authorInput" placeholder="Enter author name...">
            <button id="searchBtn" class="btn search">Search</button>
        </div>

        <div id="result" class="result-box">
            <!-- Book info will appear here -->
        </div>

        <button id="readingListBtn" class="btn list" style="display: none;">Open Reading List</button>
    </div>

    <script src="index.js"></script>
</body>
</html>
