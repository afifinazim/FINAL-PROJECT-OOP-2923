<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <h1 id="title" class="app-title">📖 Create Reading Summary</h1>

        <div class="input-section">
            <input type="text" id="titleInput" placeholder="Book Title">
            <input type="text" id="editionInput" placeholder="Edition">
            <input type="text" id="yearInput" placeholder="Year Published">
            <input type="text" id="ebookInput" placeholder="E-Book (Available / Not Available)">
            <button id="saveBtn" class="btn add">Add Book</button>
        </div>

        <div id="bookList" class="book-list">
            <!-- Saved books will appear here -->
        </div>

    </div>

    <script src="readingList.js"></script>
</body>
</html>
